<mat-sidenav-container class="shell-container">
  <!-- Left nav -->
  <mat-sidenav mode="side" opened class="left-nav">
    <div class="nav-brand">
      <mat-icon>local_bar</mat-icon>
      <span>ROLLER POS</span>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/catalogue" routerLinkActive="active-link">
        <mat-icon matListItemIcon>menu_book</mat-icon>
        <span matListItemTitle>Catalogue</span>
      </a>
      <a mat-list-item routerLink="/tabs" routerLinkActive="active-link">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Tabs</span>
      </a>
      <a mat-list-item routerLink="/admin" routerLinkActive="active-link">
        <mat-icon matListItemIcon>admin_panel_settings</mat-icon>
        <span matListItemTitle>Admin</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Main content -->
  <mat-sidenav-content class="main-content">
    <mat-toolbar color="primary" class="top-bar">
      <span class="toolbar-title">F&amp;B Point of Sale</span>
    </mat-toolbar>
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>

  <!-- Right tab panel — always visible -->
  <mat-sidenav position="end" mode="side" opened class="tab-panel">
    <app-tab-panel></app-tab-panel>
  </mat-sidenav>
</mat-sidenav-container>
